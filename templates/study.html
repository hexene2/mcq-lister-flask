
{% extends "base.html" %}

{% block title %}MCQ Practice{% endblock %}

{% block content %}


<section id="genrateQuestion">
    <select name="subject" id="subject" class="select baseMP hover baseBorder">
    </select>
    
    <select name="topic" id="topic" class="select baseMP baseBorder hover">
        <option value="Mix">Mix</option>
    </select>
    
    <select name="eloRange" id="eloRange"  class="select baseMP baseBorder hover">
        <option value="">Mix</option>
        <option value="100-500">100-500</option>
        <option value="500-1500">500-1500</option>
        <option value="1500-3000">1500-3000</option>
    </select>
    <button id="nextQuestion" class="baseMP baseBorder hover">next</button>
</section>



<div class="mcq-study-main">

    <div class="mcq-study-question" id="QuestionDiv">
        What is the derivative of x²?
    </div>

    <div class="mcq-study-answers" id="AnswersDiv">
        <button class="mcq-study-answer-btn baseBorder hover" id="mcq-study-answer-btn1" >
            Answer One: 2x
        </button>

        <button class="mcq-study-answer-btn baseBorder hover" id="mcq-study-answer-btn2">
            Answer Two: x
        </button>

        <button class="mcq-study-answer-btn baseBorder hover" id="mcq-study-answer-btn3">
            Answer Three: x³
        </button>
        <button class="mcq-study-answer-btn baseBorder hover" id="mcq-study-answer-btn4">
            Answer Three: x³
        </button>
    </div>
    <div class="mcq-study-nav">
        <button class="checkAnswer hover baseBorder" id="back-btn">back</button>
        <button class="checkAnswer hover baseBorder" id="checkAnswer">solve</button>    
        <button class="checkAnswer hover baseBorder" id="next-btn">next</button>
    </div>
    <div id="explanationBox" class="fullsize baseBorder">
        ok this is the thing
    </div>
</div>

{% endblock %}



{% block scripts %}
    <script defer src="{{ url_for('static', filename='study.js') }}"></script>
    <script defer src="{{ url_for('static', filename='subjectSelect.js') }}"></script>
{% endblock %}
