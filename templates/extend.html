
{% extends "base.html" %}

{% block title %}MCQ Practice{% endblock %}

{% block content %}


<section id="genrateQuestion">
    <select name="subject" id="subject" class="select">
        <option value="all">all</option>
        <option value="maths">Maths</option>
        <option value="physics">Physics</option>
        <option value="chemistry">Chemistry</option>
    </select>
    
    <select name="topic" id="topic" class="select">
        <option value="">Select Topic</option>
    </select>
    
    <select name="elo-range" id="elo-range"  class="select">
        <option value="">Select Difficulty</option>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
    </select>
    <button id="nextQuestion">next</button>
</section>



<div class="mcq-study-main">

    <div class="mcq-study-question">
        What is the derivative of x²?
    </div>

    <div class="mcq-study-answers">
        <button class="mcq-study-answer-btn">
            Answer One: 2x
        </button>

        <button class="mcq-study-answer-btn">
            Answer Two: x
        </button>

        <button class="mcq-study-answer-btn">
            Answer Three: x³
        </button>
    </div>

</div>

{% endblock %}
