<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Study App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
</head>

<body>

    <div class="app">

        <!-- LEFT SIDEBAR -->
        <aside class="sidebar left-sidebar">
            <div class="sidebar-header">
                <h3>Left Sidebar</h3>
                <button id="toggleTheme">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M376-376q-42.5-42.5-42.5-104T376-584.25Q418.5-627 480-627t104.25 42.75Q627-541.5 627-480t-42.75 104Q541.5-333.5 480-333.5T376-376Zm-177-91.5H67.5V-493H199v25.5Zm694 0H761.5V-493H893v25.5Zm-425.5-294V-893H493v131.5h-25.5Zm0 694V-199H493v131.5h-25.5ZM274-670l-80.5-78 17.5-19.5 80 79.5-17 18Zm475 477.5L670-272l16-18.5 80.5 78.5-17.5 19.5ZM670-686l78-80.5 19.5 17.5-79.5 79.5-18-16.5ZM192.5-211l79.5-79.5 16.5 16.5-77 81-19-18Z"/></svg>
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M482.91-173.5q-127.74 0-217.08-89.42-89.33-89.42-89.33-217.17 0-112.41 71.02-196.41T425-782h-3q-13.5 28-20.75 58.75T394-660.19q0 112.4 78.46 190.79Q550.92-391 663-391q32.38 0 62.86-7.29 30.48-7.3 58.14-20.71v-3q-20.5 106.46-104.59 177.48t-196.5 71.02Z"/></svg>

                </button>
            </div>

            <div class="sidebar-content" id="left-content">
                <!-- Add your items here -->
                <li><div class="fullsize margin10px li"><a href="{{ url_for('study') }}">Study</a></div></li>
                <li><div class="fullsize margin10px li"><a href="{{ url_for('dashboard') }}">Dashboard</a></div></li>
                <li><div class="fullsize margin10px li"><a href="{{ url_for('edit') }}">Edit</a></div></li>
                <li><div class="fullsize margin10px li"><a href="{{ url_for('settings') }}">Settings</a></div></li>

            </div>
        </aside>




        <main class="main-content" id="main-content">

            {% block content %}
            {% endblock %}
            
        </main>





        <!-- RIGHT SIDEBAR -->
        <aside class="sidebar right-sidebar">
            <div class="sidebar-header">
                <h3>Right Sidebar</h3>
            </div>

            <div class="sidebar-content" id="right-content">
                <!-- Add your items here -->
            </div>
        </aside>

    </div>

</body>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</html>
